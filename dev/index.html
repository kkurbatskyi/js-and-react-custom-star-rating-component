<!doctype html>
<html lang="en">
  <head>
    <title>Sidereal — dev pages</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Index of the standalone dev harness pages." />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(120% 90% at 20% 0%, #0d1424 0%, #05070c 60%) fixed;
        color: #d7dde8;
        color-scheme: dark;
        font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }
      h1 {
        margin: 0;
        font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #f1d9a0;
      }
      .lede {
        margin: 10px 0 28px;
        color: #8da2c0;
      }
      code {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #c9d4e6;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid #1d2636;
      }
      li a {
        display: grid;
        grid-template-columns: minmax(10em, 14em) 1fr;
        gap: 4px 20px;
        padding: 14px 4px;
        border-bottom: 1px solid #1d2636;
        color: inherit;
        text-decoration: none;
      }
      li a:hover,
      li a:focus-visible {
        background: rgba(141, 162, 192, 0.07);
        outline: none;
      }
      .name {
        color: #f3f5f9;
        font-weight: 500;
      }
      .file {
        display: block;
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #6b7d99;
      }
      .desc {
        color: #93a1b7;
      }
      @media (max-width: 560px) {
        li a {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sidereal · dev pages</h1>
      <p class="lede">
        Standalone pages that mount one module under the real PostFX pipeline. Every
        <code>dev/*.html</code> file appears here automatically — see <code>dev/README.md</code>.
      </p>
      <ul id="pages"></ul>
    </main>
    <script type="module">
      // Built at dev time from the files on disk: add a page and it shows up here.
      const pages = import.meta.glob('./*.html', { query: '?raw', import: 'default', eager: true });
      const list = document.getElementById('pages');
      const parser = new DOMParser();
      const entries = Object.entries(pages)
        .filter(([path]) => path !== './index.html')
        .map(([path, html]) => {
          const doc = parser.parseFromString(String(html), 'text/html');
          const file = path.slice(2);
          return {
            file,
            title: doc.title.trim() || file,
            desc: doc.querySelector('meta[name="description"]')?.getAttribute('content') ?? '',
          };
        })
        .sort((a, b) => a.title.localeCompare(b.title));
      for (const { file, title, desc } of entries) {
        const a = document.createElement('a');
        a.href = `./${file}`;
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = title;
        const fileEl = document.createElement('span');
        fileEl.className = 'file';
        fileEl.textContent = file;
        name.append(fileEl);
        const d = document.createElement('span');
        d.className = 'desc';
        d.textContent = desc;
        a.append(name, d);
        const li = document.createElement('li');
        li.append(a);
        list.append(li);
      }
      window.__READY__ = true;
    </script>
  </body>
</html>
